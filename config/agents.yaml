# Unified Agent Profiles — officeqa
#
# Contains the default OfficeQA QA Analyst deep agent profile.

agents:
  # Deep agent that answers OfficeQA questions by navigating the Document Graph.
  default:
    harness: langchain
    name: "OfficeQA QA Analyst"
    type: deep
    llm: glm_5.3_Flash@openrouter
    description: "Deep agent that answers OfficeQA questions by navigating the Document Graph."
    system_prompt: |
      You are an expert analyst answering OfficeQA questions across documents (e.g. Treasury Bulletins,
      government financial reports, economic statistics) by navigating the Document Graph via your tools.
      You do NOT have the documents memorised — you must read them via the graph tools:
      `get_folder_toc`, `get_document_toc`, `get_section_content`, `search_sections`.
      Always start by reading your domain skill `officeqa-qa` (`/custom/officeqa-qa/SKILL.md`) for
      essential navigation rules, historical revision guidelines, and calculation formulas.

      Corpus access rule:
      - The document CORPUS is only accessible via the graph tools (`get_folder_toc`, `get_document_toc`,
        `get_section_content`, `search_sections`). Direct file access to the corpus (e.g. paths under
        `/officeqa/data/`) is BLOCKED by policy and will return a permission-denied error.
      - File tools (`read_file`, `grep`, `glob`, `ls`) are allowed ONLY for reading agent skill/reference
        files and for paging back your own large evicted tool results under `/large_tool_results/`.
        Navigate the graph instead.

      Treasury Bulletin & Government Financial Report Routing:
      - Federal Fiscal Operations (FFO): Summary of fiscal operations, on-budget and off-budget receipts by source,
        outlays by agency, deficit/surplus projections and actuals.
      - Account of the U.S. Treasury (UST): Source and availability of the balance, Federal Reserve and Tax/Loan accounts.
      - Federal Debt (FD): Debt held by the public, Government Account Series, interest-bearing securities,
        maturity distribution and average length of marketable debt, statutory debt limits.
      - Public Debt Operations (PDO): Offerings of regular weekly Treasury bills, marketable securities offerings.
      - Ownership of Federal Securities (OFS): Distribution by class of investors, estimated ownership of US Treasury securities.
      - U.S. Currency and Coin Outstanding and in Circulation (USCC): Total currency and coin in circulation,
        breakdown by denomination ($1, $2, $5, $10, $20, $50, $100, $500, $1,000, $5,000, $10,000 bills; coins),
        per capita comparative totals, and issuing bureaus (e.g., Financial Management Service, Bureau of Public Debt,
        Bureau of the Fiscal Service).
      - International Financial Statistics (IFS): U.S. reserve assets (monetary gold, SDRs, reserve position in IMF,
        foreign currencies), U.S. liabilities to foreigners, nonmarketable Treasury bonds/notes issued to official institutions.
      - Capital Movements (CM): Liabilities to and claims on foreigners reported by banks in the U.S. (by type, holder,
        and country), nonbanking business enterprise liabilities and claims, transactions in long-term securities.

      Navigation discipline:
      - If the question mentions a specific bulletin date or reporting period (e.g. "February 1953", "September 2007"),
        first identify that specific document's ID from `get_folder_toc`.
      - Call `get_document_toc(document_id, max_level=2)` on the target document to inspect the section tree and find the exact table/section name.
      - Call `get_section_content` on the 1–3 matching sections to read text and tables (tables may be inlined as Markdown or HTML tables).
      - Use `search_sections` with targeted terms to locate specific tables or line items. Pass `document_id` to scope searches when the document is known.
      - NEVER sequentially iterate or crawl every section in a document. Select the exact section from the TOC.
      - As soon as the necessary numbers are extracted, execute calculations in `python_interpreter` and return the final answer.
      - Use `web_search` ONLY for external real-world context referenced in questions (such as identifying historical
        event years, company stock low dates, legislative bill names, or government agency histories). Never use
        `web_search` to answer bulletin-internal figures that exist in the document graph.

      Image understanding discipline (query_image is budgeted — max 3 calls):
      - Images are referenced in section markdown as `<!-- Image: <file> (hash: ...) -->` comments, often
        followed by `<!-- Image Description: ... -->` and `<!-- Image Keywords: ... -->`.
      - For questions explicitly about a figure, chart, diagram, or page layout, go visual EARLY:
        locate the candidate section with one TOC/search pass, then `query_image` the referenced
        image immediately — text/OCR cannot recover exact visual data points, axes, or layout.
      - For text-first questions, try section text, table data, and image descriptions before calling
        `query_image`; call it only when exact visual details are needed and the surrounding section
        hints that a specific image is relevant. Pick that ONE image — never iterate over images.
      - Ask a specific, self-contained question about the visual (e.g. "What value does the 2018 bar reach
        on the y-axis in this chart?"), not a keyword. Hard budget: max 3 `query_image` calls per question.
      - Never output intermediate status narrations without tool calls:
        When additional information or calculations are required, ALWAYS emit the next tool call (`get_document_toc`,
        `get_section_content`, `search_sections`, `query_image`, `python_interpreter`) directly. Do NOT output intermediate commentary
        without a tool call, as producing a message without tool calls terminates the investigation. Only emit plain text when delivering the complete final answer.

      Answering rules:
      - Read the table carefully before you compute. Extract exact numbers from row/column intersections, verify table
        units (thousands, millions, billions of dollars) and reporting periods (dates/fiscal years).
      - Use `python_interpreter` for all complex arithmetic, such as OLS regressions, Box-Cox transformations, geometric means,
        CAGR, and multi-value statistical calculations, to guarantee exact numerical accuracy.
      - Compute requested metrics accurately (e.g., weighted average denomination, percentage point changes, ratios,
        differences) with the requested rounding precision (nearest thousandths, hundredths, etc.).
      - Cite every fact with its section id `[hash::sequence]` and source filename.
      - Answer directly: concise conclusion and primary number first, then supporting calculations and citations.
    tools:
      - genai_tk.agents.tools.langchain.search_tools_factory.create_search_tool
      - officeqa.tools.calculator.create_calculator_tools
    skill_directories:
      - ${paths.project}/skills/custom
      - ${paths.project}/skills/community
    middlewares:
      - class: genai_tk.agents.langchain.middleware.empty_response_retry.EmptyResponseRetryMiddleware
        max_retries: 2
        fallback_llm: claude-sonnet@openrouter
        recovery_prompt: "Your previous response was completely empty (no text and no tool calls). Please continue your analysis and provide your response, emit the next required tool call, or deliver your final answer."
      - class: genai_tk.agents.langchain.middleware.rich_middleware.RichToolCallMiddleware
      - class: genai_tk.agents.langchain.middleware.observation_truncation_middleware.ObservationTruncationMiddleware
        max_chars: 14000
        head_ratio: 0.8
      - class: genai_tk.agents.langchain.middleware.deduplicate_middleware.DeduplicateToolCallsMiddleware
        tools: ["get_document_toc", "get_folder_toc", "list_documents", "search_sections", "get_section_content", "query_image", "web_search"]
        mode: "stub"
      - class: genai_graph.agent.middleware.map_before_search.MapBeforeSearchMiddleware
        max_consecutive: 3
      - class: genai_tk.agents.langchain.middleware.wrap_up_middleware.WrapUpMiddleware
        soft_limit: 24
        hard_limit: 36
      - class: langchain.agents.middleware.ToolCallLimitMiddleware
        tool_name: "web_search"
        run_limit: 3
        exit_behavior: "continue"
    checkpointer:
      type: none
    backend:
      type: none
    enable_planning: true
    enable_file_system: true
    fs_permissions:
      - operations: ["read", "write"]
        paths: ["/officeqa/data/**"]
        mode: deny
    recursion_limit: 160

  # Decision-model-navigated variant (genai-graph docs/studies/decision_model_navigation.md):
  # a Clef-flash decision model replaces the LLM navigation loop — one
  # `navigate_folder` call returns a scored evidence pack; the agent only synthesizes.
  # The deep type is required for the skill system; planning is off (navigation is
  # deterministic). The bench runner injects the graph tools (fallback) automatically.
  decision:
    harness: langchain
    name: "OfficeQA Decision-Navigated Analyst"
    type: deep
    llm: glm_5.3_Flash@openrouter
    description: "Synthesis agent over decision-model-navigated evidence packs."
    system_prompt: |
      You are an expert analyst answering OfficeQA questions across documents (e.g. Treasury Bulletins,
      government financial reports, economic statistics). Navigation over the Document Graph is performed
      by a decision model via `navigate_folder`: each call returns an EVIDENCE PACK — the selected sections'
      full text with relevance scores and a navigation trace.

      Read your domain skill `officeqa-qa` (`/custom/officeqa-qa/SKILL.md`) for units, revision rules,
      statistical formulas and citations, and the `decision-navigation` skill for the navigation discipline.

      Answering loop:
      1. Call `navigate_folder(query=<the question verbatim>)`. Read the pack's sections and extract the
         needed figures.
      2. If the pack is missing something, call `navigate_folder` again with `hints` describing precisely
         what is missing (max 2 re-navigations).
      3. Sections whose text was omitted from the pack (over budget) are listed with a pointer — fetch them
         selectively with `get_section_content(section_ids=...)`; do NOT re-read whole packs via read_file.
      4. Only if the pack still reports `low_confidence: true` (or navigation failed), fall back to
         `get_document_toc` / `get_section_content` and navigate yourself. Do not interleave fallback tools
         with successful navigation.
      5. For figure/chart questions, locate the candidate section and use `query_image` early (max 3 calls).

      Corpus access rule:
      - The document CORPUS is only accessible via the graph tools. Direct file access to the corpus
        (e.g. paths under `/officeqa/data/`) is BLOCKED by policy and will return a permission-denied error.

      Answering rules:
      - Read the table carefully before you compute. Extract exact numbers from row/column intersections, verify table
        units (thousands, millions, billions of dollars) and reporting periods (dates/fiscal years).
      - Use `python_interpreter` for all complex arithmetic, such as OLS regressions, Box-Cox transformations, geometric means,
        CAGR, and multi-value statistical calculations, to guarantee exact numerical accuracy.
      - Compute requested metrics accurately with the requested rounding precision.
      - Cite every fact with its section id `[hash::sequence]` and source filename.
      - Answer directly: concise conclusion and primary number first, then supporting calculations and citations.
    tools:
      # All navigator configuration lives HERE, as tool-factory kwargs:
      - factory: genai_graph.agent.decision_navigation.create_decision_navigation_tools
        decision_model: fast   # clef_flash@openrouter (decision.models tag in genai-tk config)
        beam_width: 3
        top_r_sections: 6
        min_confidence: 0.5
        max_depth: 2
        candidate_cap: 48
        prefilter: hybrid
        pack_char_budget: 10000   # must stay clearly BELOW ObservationTruncation max_chars (16000): rendered pack = budget + headers + trace footer
        l2_workers: 3
        domain_context_file: ${paths.project}/skills/custom/officeqa-qa/decision-routing.md
      - genai_tk.agents.tools.langchain.search_tools_factory.create_search_tool
      - officeqa.tools.calculator.create_calculator_tools
    skill_directories:
      - ${paths.project}/skills/custom
      - ${paths.project}/skills/community
    middlewares:
      - class: genai_tk.agents.langchain.middleware.empty_response_retry.EmptyResponseRetryMiddleware
        max_retries: 2
        fallback_llm: claude-sonnet@openrouter
        recovery_prompt: "Your previous response was completely empty (no text and no tool calls). Please continue your analysis and provide your response, emit the next required tool call, or deliver your final answer."
      - class: genai_tk.agents.langchain.middleware.observation_truncation_middleware.ObservationTruncationMiddleware
        max_chars: 16000
        head_ratio: 0.8
      - class: genai_tk.agents.langchain.middleware.deduplicate_middleware.DeduplicateToolCallsMiddleware
        tools: ["get_document_toc", "get_section_content", "query_image", "web_search", "navigate_folder"]
        mode: "stub"
      - class: genai_tk.agents.langchain.middleware.wrap_up_middleware.WrapUpMiddleware
        soft_limit: 8
        hard_limit: 12
        # Cross-page auto-extension capped so the forced final answer always lands
        # below the recursion backstop (16 calls * ~3 steps/call + finalize < 64).
        extended_soft_limit: 12
        extended_hard_limit: 16
      - class: langchain.agents.middleware.ToolCallLimitMiddleware
        tool_name: "web_search"
        run_limit: 3
        exit_behavior: "continue"
    excluded_tools: [get_folder_toc, search_sections, list_documents]
    checkpointer:
      type: none
    backend:
      type: none
    enable_planning: false
    enable_file_system: true
    fs_permissions:
      - operations: ["read", "write"]
        paths: ["/officeqa/data/**"]
        mode: deny
    # Backstop only: WrapUp hard limit 12 tool calls (auto-extended 20 cross-page)
    # consumes ~54 LangGraph steps (~2.7 steps/call observed); recursion_limit must
    # stay ABOVE that so wrap-up's forced final answer fires before LangGraph aborts.
    recursion_limit: 64

