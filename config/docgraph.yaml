# Document Graph building profile for OfficeQA (Treasury Bulletins corpus)
default_profile: default

docgraph_profiles:
  default:
    description: "Multimodal Document Graph for OfficeQA Treasury Bulletins with HTML tables and VLM image understanding"
    markdownize_profile: best

    paths:
      sources_dir: ${paths.data_root}/pdfs
      markdown_dir: ${paths.data_root}/markdown_multi
      kg_db: ${paths.data_root}/kg/officeqa.db
      saved_markdown_dir: ~/OneDrive/prj/officeqa/markdown

    llms:
      summary: deepseek-v4-flash-0731(none)@openrouter  # Structure discovery & section descriptions (reasoning disabled)
      image: gemini-2.5-flash@openrouter                # VLM for uncaptioned image descriptions and query_image

    images:
      enabled: true                                     # Enable multimodal visual capabilities
      describe_uncaptioned: true                        # Generate descriptions for uncaptioned images >10KB
      min_size_bytes: 10240
      max_queries_per_turn: 3

    build:
      structure_strategy: auto                         # auto | algo | toc_preamble | llm_full
      generate_summaries: true                         # generate section descriptions & summaries for TOC navigation
      summary_min_tokens: 800
      context_safety_ratio: 0.9
      fts: true                                        # native BM25/FTS index over MarkdownSection
      chunk_size_tokens: 1500
      workers: 6
      skip_ocr: false
      force: false
