# OfficeQA evaluation configuration.
# Select active profile via CLI `--profile <name>` (defaults to `default_profile`).
# Outcome paths write under a dedicated directory per bench profile.

# Decision-navigated runs are the primary configuration (as for vidore): the
# DecisionRAG navigator replaces LLM-driven navigation; graph tools remain the
# fallback path. Override with `-p default` for the pure-LLM navigation baseline.
default_profile: decision_fast
dataset_adapter: officeqa.adapter.OfficeQAAdapter

# Shared outcome paths across all bench profiles
paths:
  runs: ${paths.data_root}/officeqa/{profile}/runs.jsonl
  scores: ${paths.data_root}/officeqa/{profile}/scores.jsonl
  scores_summary: ${paths.data_root}/officeqa/{profile}/scores_summary.json

bench_profiles:
  default:
    description: "GLM 5.3 Flash agent with DeepSeek V4 Pro grader on OfficeQA corpus"
    docgraph_profile: default
    agent_profile: default

    files:
      pathspecs:
        - "*"
      docs: []
      limit: null

    runner:
      concurrency: 6
      folder_id: null
      monitoring: null

    grader:
      enabled: true
      llm: DeepSeek-V4-Pro-0813@openrouter
      concurrency: 4

  decision_fast:
    description: "DecisionRAG navigator (JEV decision model) + GLM 5.3 Flash synthesis on OfficeQA corpus"
    docgraph_profile: default
    agent_profile: decision

    files:
      pathspecs:
        - "*"
      docs: []
      limit: null

    runner:
      # 1: host memory is the binding constraint. At 4 the 2026-11-02 run exhausted
      # the Ladybug buffer pool after 17/33 questions, at 2 the 2026-11-14 run
      # aborted after 12/39 (pool full at ~7.7GB RSS). Sequential L1 navigation
      # costs latency, not correctness.
      concurrency: 1
      folder_id: null
      monitoring: null

    grader:
      enabled: true
      llm: DeepSeek-V4-Pro-0813@openrouter
      concurrency: 4

  deerflow:
    description: "DeerFlow GLM 5.3 Flash agent on OfficeQA corpus"
    docgraph_profile: default
    agent_profile: deerflow

    files:
      pathspecs:
        - "*"
      docs: []
      limit: null

    runner:
      concurrency: 2
      folder_id: null
      monitoring: null

    grader:
      enabled: true
      llm: DeepSeek-V4-Pro-0813@openrouter
      concurrency: 4



