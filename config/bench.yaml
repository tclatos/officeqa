# OfficeQA evaluation configuration.
# Select active profile via CLI `--profile <name>` (defaults to `default_profile`).
# Outcome paths write under a dedicated directory per bench profile.

default_profile: default
dataset_adapter: officeqa.adapter.OfficeQAAdapter

# Shared outcome paths across all bench profiles
paths:
  runs: ${paths.data_root}/officeqa/{profile}/runs.jsonl
  scores: ${paths.data_root}/officeqa/{profile}/scores.jsonl
  scores_summary: ${paths.data_root}/officeqa/{profile}/scores_summary.json

bench_profiles:
  default:
    description: "GLM 5.3 Flash agent with DeepSeek V4 Pro grader on OfficeQA corpus"
    docgraph_profile: default
    agent_profile: default

    files:
      pathspecs:
        - "*"
      docs: []
      limit: null

    runner:
      concurrency: 6
      folder_id: null
      monitoring: null

    grader:
      enabled: true
      llm: DeepSeek-V4-Pro-0813@openrouter
      concurrency: 4



