# ---------------------------------------------------------------------------
# OfficeQA ingest route table
# ---------------------------------------------------------------------------
# Consumed by the bench build stage (docgraph_profiles.<profile>.ingest_routes):
# corpus documents are dispatched through this table — structured JSON sources
# through the json_document workflow, everything else (PDFs) through the
# markdownize flow with the 'best' profile (Mistral OCR, HTML tables, image
# extraction).
#
# !! FIRST MATCH WINS: rules are evaluated top-down and the first rule whose
# pathspec matches routes the item. Reordering rules silently re-routes
# sources (the table fingerprint feeds the caches).
# Workflow refs are dotted import paths (like the built-in 'default' table's
# web-page rule) so they resolve in any project, independent of which YAML
# workflow files the project ships.
ingest_routes:

  officeqa:
    description: >
      OfficeQA corpus — PDFs through the markdownize flow (profile 'best':
      Mistral OCR with HTML tables and image extraction); structured JSON
      sources through the json_document flow.
    routes:
      - pathspec: "**/*.json"
        workflow: genai_graph.orchestration.ingest_flows.json_document_flow
      - pathspec: "**/*"
        workflow: genai_tk.workflow.markdownize.markdownize_flow
        with:
          profile: best
